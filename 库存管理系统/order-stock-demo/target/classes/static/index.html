<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>概览 - 订单库存管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo">🛒 订单库存系统</div>
    <div class="logo-sub">Order &amp; Stock Demo</div>
    <nav class="nav">
      <a href="index.html"><span class="icon">📊</span> 概览</a>
      <a href="products.html"><span class="icon">📦</span> 商品管理</a>
      <a href="orders.html"><span class="icon">🧾</span> 订单管理</a>
    </nav>
    <div class="sidebar-footer">Spring Boot · MyBatis<br>MySQL</div>
  </aside>

  <main class="main">
    <h1 class="page-title">概览</h1>
    <p class="page-desc">实时查看系统整体运营情况</p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="icon-box icon-indigo">📦</div>
        <div><div class="label">商品总数</div><div class="value" id="stat-product">-</div></div>
      </div>
      <div class="stat-card">
        <div class="icon-box icon-green">🧾</div>
        <div><div class="label">订单总数</div><div class="value" id="stat-order">-</div></div>
      </div>
      <div class="stat-card">
        <div class="icon-box icon-orange">💰</div>
        <div><div class="label">已支付金额</div><div class="value" id="stat-sales">-</div></div>
      </div>
      <div class="stat-card">
        <div class="icon-box icon-red">⚠️</div>
        <div><div class="label">低库存商品（≤10）</div><div class="value" id="stat-lowstock">-</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>最近订单</h3>
        <a href="orders.html" class="btn btn-ghost btn-sm">查看全部 →</a>
      </div>
      <table class="table">
        <thead><tr><th>订单号</th><th>金额</th><th>状态</th><th>创建时间</th></tr></thead>
        <tbody id="recent-orders"></tbody>
      </table>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
