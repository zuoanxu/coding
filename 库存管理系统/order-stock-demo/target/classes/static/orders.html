<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理 - 订单库存管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo">🛒 订单库存系统</div>
    <div class="logo-sub">Order &amp; Stock Demo</div>
    <nav class="nav">
      <a href="index.html"><span class="icon">📊</span> 概览</a>
      <a href="products.html"><span class="icon">📦</span> 商品管理</a>
      <a href="orders.html"><span class="icon">🧾</span> 订单管理</a>
    </nav>
    <div class="sidebar-footer">Spring Boot · MyBatis<br>MySQL</div>
  </aside>

  <main class="main">
    <div class="page-header-row">
      <div>
        <h1 class="page-title">订单管理</h1>
        <p class="page-desc">下单扣库存，支持支付与取消</p>
      </div>
      <button class="btn btn-primary" onclick="openCreateModal()">＋ 创建订单</button>
    </div>

    <div class="card">
      <table class="table">
        <thead><tr><th>订单号</th><th>金额</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody id="order-tbody"></tbody>
      </table>
    </div>
  </main>

  <!-- 创建订单弹窗 -->
  <div class="modal" id="create-modal">
    <div class="modal-dialog">
      <div class="modal-header"><h3>创建订单</h3><button class="modal-close" onclick="closeModal('create-modal')">×</button></div>
      <div class="modal-body">
        <p class="muted" style="margin-bottom:10px;">填写想购买的数量（留空或 0 表示不买）</p>
        <div id="create-products"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('create-modal')">取消</button>
          <button class="btn btn-primary" id="submit-order-btn" onclick="submitCreate()">提交订单</button>
      </div>
    </div>
  </div>

  <!-- 订单详情弹窗 -->
  <div class="modal" id="detail-modal">
    <div class="modal-dialog">
      <div class="modal-header"><h3>订单详情</h3><button class="modal-close" onclick="closeModal('detail-modal')">×</button></div>
      <div class="modal-body">
        <div class="detail-info">
          <div class="row"><span>订单号</span><span id="detail-order-no">-</span></div>
          <div class="row"><span>状态</span><span id="detail-status">-</span></div>
          <div class="row"><span>总金额</span><span id="detail-amount">-</span></div>
          <div class="row"><span>创建时间</span><span id="detail-time">-</span></div>
        </div>
        <table class="table">
          <thead><tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr></thead>
          <tbody id="detail-items"></tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('detail-modal')">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
