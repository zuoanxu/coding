server:
  port: 8080

spring:
    # 数据源配置
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/order_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: root

    # ===== 新增：Redis 连接配置 =====
    redis:
      host: localhost      # Redis 就在本机 Docker 里
      port: 6379           # 端口和 docker-compose 里映射的一致

    jackson:
      time-zone: GMT+8
      date-format: yyyy-MM-dd HH:mm:ss
      serialization:
        write-dates-as-timestamps: false

# MyBatis 配置
mybatis:
  configuration:
    # 下划线转驼峰：数据库字段 total_price -> 实体属性 totalPrice
    map-underscore-to-camel-case: true
  type-aliases-package: com.example.order.entity

# ===== 新增：RocketMQ 配置 =====
rocketmq:
  name-server: 127.0.0.1:9876        # 本机 Docker 里的 NameServer，端口和 docker-compose 映射一致
  producer:
    group: order-producer-group      # 生产者组；消费者组在代码里用 @RocketMQMessageListener 的 consumerGroup 指定
